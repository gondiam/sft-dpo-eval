# Everything the GPU stages read. Changing a value after PREREGISTRATION.md is a
# deviation and gets logged there.
model: Qwen/Qwen3-1.7B

lora: {r: 16, lora_alpha: 32, lora_dropout: 0.05, target_modules: all-linear}

# one epoch over 20,400 examples; effective batch 16
sft:
  learning_rate: 2.0e-4
  num_train_epochs: 1
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  max_length: 1024
  lr_scheduler_type: cosine
  warmup_steps: 30

# trained on top of the merged SFT model; the reference is that same model
dpo:
  learning_rate: 2.0e-5
  beta: 0.1
  num_train_epochs: 1
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  max_length: 1024
  lr_scheduler_type: cosine
  warmup_steps: 10

samples_per_item: 4
generation: {max_new_tokens: 256, batch_size: 16}

# smoke: real model, a few steps, to check memory and measure throughput
smoke: {items: 200, eval_items: 20, max_steps: 10}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sft-dpo-eval"
version = "0.1.0"
description = "SFT then DPO on PubMedQA with a small open model, each stage measured against noise."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "llm-judge-stats @ git+https://github.com/gondiam/llm-judge-stats@93e684d",
    "datasets>=4",
    "numpy>=1.24",
]

[project.optional-dependencies]
# GPU stages only (Kaggle); local work needs none of these
train = ["torch", "transformers==5.22.1", "trl==1.17.1", "peft==0.21.2", "accelerate==1.15.0", "pyyaml"]

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["sft_dpo_eval"]

[[tool.mypy.overrides]]
module = ["datasets.*", "llm_judge_stats.*", "torch.*", "transformers.*", "trl.*", "peft.*", "yaml.*"]
ignore_missing_imports = true
